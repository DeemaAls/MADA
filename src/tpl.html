<title>مدى MADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a real product site. Public pages (landing, account type, logins) lead into two web dashboards with a right-hand sidebar (RTL):
   the physician portal and the child/parent portal, sharing one monitoring plan. Single light theme on purpose, matching the MADA reference boards. */
:root{
  color-scheme:light;
  --page:#FFFFFF; --bg:#F8F7FD; --surface:#FFFFFF; --soft:#F1EEFE; --soft-2:#E3DDFD; --tile:#F7F6FC;
  --ink:#1D1A3A; --ink-2:#403B66; --muted:#8A86A6; --line:#ECEAF4;
  --primary:#5B3FE0; --primary-2:#7C64F2; --on-primary:#FFFFFF;
  --ok:#17A06A; --ok-soft:#E3F6ED; --warn:#E08A1E; --warn-soft:#FDF1E0; --bad:#E2455A; --bad-soft:#FDE7EA; --blue:#3E7BEA;
  --skin:#F3C9A8;
  --f-display:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --f-body:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --shadow:0 2px 10px -4px rgba(60,40,150,.12),0 1px 2px rgba(60,40,150,.05);
  --shadow-lg:0 18px 40px -20px rgba(60,40,150,.35);
  --r:16px;
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
img{max-width:100%}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.h{font-family:var(--f-display);font-weight:700;margin:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* logo */
.logo{display:inline-flex;align-items:center;gap:0;position:relative;text-decoration:none;color:var(--primary);flex:none}
.logo .w{display:grid;line-height:1;text-align:center}
.logo b{font-family:var(--f-display);font-weight:700;font-size:var(--ls,22px);letter-spacing:.02em}
.logo span{font-family:var(--f-display);font-weight:700;font-size:calc(var(--ls,22px)*.82);margin-top:-2px}
.logo{padding-top:calc(var(--ls,22px)*.28)}.logo svg{position:absolute;left:-6%;top:-6%;width:112%;height:auto;pointer-events:none}

/* buttons */
.btn{border:1.5px solid transparent;border-radius:10px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--on-primary);text-decoration:none;white-space:nowrap}
.btn:hover{background:#4E33D0}
.btn svg{width:18px;height:18px}
.btn.out{background:var(--surface);color:var(--primary);border-color:var(--primary)}
.btn.out:hover{background:var(--soft)}
.btn.soft{background:var(--soft);color:var(--primary)}
.btn.white{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.lg{padding:13px 28px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--primary);font-weight:700;font-size:12.5px;padding:0;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.link svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--soft);color:var(--primary)} .pill.gray{background:var(--tile);color:var(--muted)}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- public ---------- */
.pub-nav{display:flex;align-items:center;gap:22px;padding-block:16px;padding-inline:max(16px,calc((100% - 1240px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.pub-nav nav{display:flex;gap:22px;font-weight:400;color:var(--ink-2)}
.pub-nav nav a{text-decoration:none}
.pub-nav nav a.on{color:var(--primary);font-weight:700}
.pub-nav .sp{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center;padding-block:56px 40px;padding-inline:max(16px,calc((100% - 1240px)/2));background:radial-gradient(80% 90% at 0% 30%,#F1ECFF 0%,rgba(255,255,255,0) 60%)}
.hero h1{font-family:var(--f-display);font-size:clamp(30px,4vw,46px);line-height:1.3;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero p{color:var(--ink-2);font-size:16px;max-width:520px;margin:0 0 26px}
.hero .ph{position:relative}
.hero .ph img{width:100%;border-radius:28px;display:block;box-shadow:var(--shadow-lg)}
.hero .float{position:absolute;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13px}
.hero .float b{font-family:var(--f-display);font-size:18px;color:var(--primary)}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.feat div{display:grid;justify-items:center;gap:6px;text-align:center;font-weight:700;font-size:13px;border-inline-start:1px solid var(--line)}
.feat div:first-child{border-inline-start:0}
.feat i{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center}
.feat i svg{width:22px;height:22px}
.how{padding-block:56px;padding-inline:max(16px,calc((100% - 1240px)/2));background:var(--bg)}
.how h2,.who-sec h2{font-family:var(--f-display);font-size:28px;margin:0 0 6px;text-align:center}
.how>p,.who-sec>p{color:var(--muted);text-align:center;margin:0 0 30px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps3 .c{background:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow);display:grid;gap:10px;align-content:start}
.steps3 .n{font-family:var(--f-display);font-weight:700;color:var(--primary);font-size:13px}
.steps3 b{font-family:var(--f-display);font-size:18px}
.steps3 .ill{height:150px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.who-sec{padding-block:56px;padding-inline:max(16px,calc((100% - 1240px)/2))}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.who2 .c{border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:10px}
.who2 ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.who2 li{display:flex;gap:8px;align-items:flex-start}
.who2 li svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:3px}
.foot{border-top:1px solid var(--line);padding-block:22px;padding-inline:max(16px,calc((100% - 1240px)/2));display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-inline:16px;background:radial-gradient(60% 60% at 50% 0%,#F1ECFF 0%,#FFFFFF 70%)}
.auth-card{width:min(460px,100%);display:grid;gap:14px;justify-items:center;text-align:center}
.auth-card h1{font-family:var(--f-display);font-size:26px;margin:6px 0 0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(560px,100%)}
.role{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:24px 16px;display:grid;justify-items:center;gap:8px;text-align:center;box-shadow:var(--shadow);transition:.15s}
.role:hover,.role.on{border-color:var(--primary);background:#F7F5FF;box-shadow:0 0 0 4px var(--soft)}
.role .ri{width:76px;height:76px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.role .ri svg{width:40px;height:40px}
.role b{font-family:var(--f-display);font-size:17px}
.role .go{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.role .go svg{width:16px;height:16px}
.form{width:100%;display:grid;gap:12px;text-align:right}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px}
.fld .pw{position:relative}
.fld .pw svg{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;width:100%}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.back-top{position:fixed;top:16px;inset-inline-start:16px}

/* ---------- portal shell ---------- */
.portal{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.side{background:#fff;border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{margin:0 14px 22px;--ls:22px;align-self:flex-start}
.side a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:400;position:relative}
.side a svg{width:20px;height:20px}
.side a:hover{background:var(--tile)}
.side a.on{background:var(--soft);color:var(--primary);font-weight:700}
.side .badge{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:10.5px;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;font-weight:700;padding:0 5px}
.side .sp{flex:1}
.main{padding:22px 28px 36px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1320px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-size:24px;margin:0}
.topbar .sp{flex:1}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px}
.userchip svg.av{width:32px;height:32px}
.userchip .chev{width:14px;height:14px;color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.crumbs a{text-decoration:none}
.crumbs svg{width:12px;height:12px}

.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .t{flex:1;min-width:0}
.card-h .t b{font-family:var(--f-display);font-weight:700;font-size:16px;display:block}
.card-h .t span{font-size:12.5px;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary);flex:none}
.ico svg{width:20px;height:20px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted)}
.sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-size:13px;color:var(--ink-2)}
.sel svg{width:14px;height:14px}

/* patients table */
.plist{display:grid}
.prow{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1fr) minmax(0,1fr) 110px;gap:14px;align-items:center;padding:14px 8px;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;text-align:right;width:100%}
.prow:hover{background:#FBFAFF}
.prow.head{font-size:12px;color:var(--muted);font-weight:700;padding-block:6px 10px;border-top:0}
.prow .who{display:flex;align-items:center;gap:12px;min-width:0}
.prow .who svg.av{width:52px;height:52px;flex:none}
.prow .who b{font-family:var(--f-display);font-weight:700;font-size:15.5px}
.prow small{display:block;color:var(--muted);font-size:12px}
.ring{position:relative;width:48px;height:48px;display:grid;place-items:center;font-weight:700;font-size:12px;font-family:var(--f-display)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}

/* patient header */
.phead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.phead svg.av{width:92px;height:92px;flex:none}
.phead .nm b{font-family:var(--f-display);font-size:24px;font-weight:700;display:block;line-height:1.3}
.phead .facts{display:flex;gap:10px;flex-wrap:wrap;margin-inline-start:auto}
.fact{display:flex;align-items:center;gap:10px;background:var(--tile);border-radius:12px;padding:10px 14px}
.fact svg{width:20px;height:20px;color:var(--primary);flex:none}
.fact small{display:block;color:var(--muted);font-size:11.5px}
.fact b{font-weight:700;font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.tabs .sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.kpi{display:flex;gap:12px;align-items:center}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:700;display:block;line-height:1.2}
.kpi .d{font-size:12px;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.tl{display:flex;justify-content:space-between;position:relative;padding:6px 6px 0}
.tl::before{content:"";position:absolute;top:19px;inset-inline:40px;height:3px;background:var(--soft-2);border-radius:9px}
.tl .p{position:relative;display:grid;justify-items:center;gap:2px;text-align:center;border:0;background:none;padding:0;min-width:0}
.tl .p i{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--primary)}
.tl .p i svg{width:14px;height:14px}
.tl .p.up i{background:#fff;color:var(--primary)}
.tl .p b{font-size:12.5px;margin-top:4px}
.tl .p span{font-size:11.5px;color:var(--muted)}
.symbox{border-radius:14px;padding:12px;display:grid;gap:4px;background:var(--tile)}
.symbox .top{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.symbox .top svg{width:18px;height:18px}
.symbox b{font-family:var(--f-display);font-size:20px;font-weight:700}
.legend-list{display:grid;gap:8px;font-size:13px;flex:1;min-width:120px}
.legend-list div{display:flex;align-items:center;gap:8px}
.legend-list i{width:9px;height:9px;border-radius:50%;flex:none}
.legend-list b{margin-inline-start:auto;font-family:var(--f-display)}
.medmini{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.medmini .mi{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary);flex:none}
.medmini .mi svg{width:22px;height:22px}
.sw{width:42px;height:24px;border-radius:99px;background:#D8D5E6;border:0;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)} .sw.on::after{inset-inline-start:21px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{color:var(--muted);font-weight:700;text-align:right;padding:8px;border-bottom:1px solid var(--line);font-size:12px}
.table td{padding:11px 8px;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}
.note{display:flex;align-items:center;gap:8px;background:var(--soft);color:var(--ink-2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.note svg{width:18px;height:18px;color:var(--primary);flex:none}
.vthumb{position:relative;border-radius:12px;overflow:hidden;background:#000;border:0;padding:0;display:block;width:100%}
.vthumb img,.vthumb video{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--primary)}
.vthumb .play svg{width:20px;height:20px}

/* wizard */
.wiz-head{display:flex;align-items:center;gap:12px}
.wiz-head .ib{border:0;background:var(--soft);color:var(--primary)}
.stepper{display:grid;grid-template-columns:repeat(5,1fr)}
.stepper .s{display:grid;justify-items:center;gap:6px;position:relative;border:0;background:none;padding:0;color:var(--muted);font-size:12.5px;font-weight:400}
.stepper .s::before{content:"";position:absolute;top:15px;height:2px;background:var(--line);inset-inline:0;z-index:0}
.stepper .s:first-child::before{inset-inline-start:50%}
.stepper .s:last-child::before{inset-inline-end:50%}
.stepper .s.done::before{background:var(--primary)}
.stepper .s.on::before{background:linear-gradient(270deg,var(--primary) 50%,var(--line) 50%)}
.stepper .s:first-child.on::before{background:var(--line)}
.stepper .s i{position:relative;z-index:1;font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);font-family:var(--f-display)}
.stepper .s.on{color:var(--primary);font-weight:700}
.stepper .s.on i{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--soft)}
.stepper .s.done i{border-color:var(--primary);color:var(--primary)}
.stepper .s.done i svg{width:15px;height:15px}
.wiz-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wiz-foot .sp{flex:1}
.s1{display:grid;grid-template-columns:200px 230px minmax(0,1fr);gap:16px;align-items:start}
.jlist{display:grid;gap:6px}
.jitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;text-align:right;width:100%}
.jitem svg{width:22px;height:22px;color:var(--muted)}
.jitem.on{background:var(--soft);border-color:var(--soft-2);color:var(--primary)}
.jitem.on svg{color:var(--primary)}
.jitem .cnt{margin-inline-start:auto;background:var(--primary);color:#fff;min-width:20px;height:20px;border-radius:99px;font-size:11px;display:grid;place-items:center;font-family:var(--f-display)}
.bodywrap{background:var(--tile);border-radius:16px;padding:12px;display:grid;place-items:center}
.bodywrap svg{width:100%;max-width:190px;height:auto}
.hot{cursor:pointer}
.mvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mv{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;display:grid;gap:8px;text-align:center}
.mv:hover{border-color:var(--soft-2)}
.mv.on{border-color:var(--primary);background:#FAF9FF}
.mv .im{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(180deg,#F5F2FF,#EDE8FF);display:grid;place-items:center;overflow:hidden}
.mv .im svg{width:86%;height:86%}
.mv .lbl{font-size:13px;font-weight:700;line-height:1.35}
.mv .lbl small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.cbx{position:absolute;top:10px;inset-inline-start:10px;width:20px;height:20px;border-radius:6px;border:1.5px solid #C9C4E0;background:#fff;display:grid;place-items:center;color:transparent;z-index:1}

.radio{display:inline-flex;align-items:center;gap:6px;font-weight:700;border:0;background:none;padding:4px 8px}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.chip button{border:0;background:rgba(91,63,224,.14);color:var(--primary);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0}

.symg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sym{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:18px 10px 12px;display:grid;justify-items:center;gap:8px;text-align:center;font-weight:700;font-size:13px}
.sym .si{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center}

.sym.se .si{background:#FFF1F0;color:#E0604F}
.selall{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--primary);font-weight:700;font-size:12.5px;padding:0}
.selall .cbx{position:static;width:17px;height:17px}
.route-tabs{display:flex;gap:8px;flex-wrap:wrap}
.route-tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.route-tabs button.on{border-color:var(--primary);background:var(--soft);color:var(--primary)}
.route-tabs .n{background:var(--primary);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.med-row{display:grid;grid-template-columns:auto minmax(0,1.4fr) repeat(4,minmax(0,1fr)) auto auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}

.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--soft-2);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
.quick button:hover{border-color:var(--primary);color:var(--primary)}
.icon-x{border:0;background:var(--bad-soft);color:var(--bad);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}

.days{display:flex;gap:10px;flex-wrap:wrap}
.dayc{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px 12px 44px;font-weight:700;font-family:var(--f-display)}
.dayc .cbx{top:50%;transform:translateY(-50%);inset-inline-start:auto;left:14px}
.dayc.on{border-color:var(--primary);background:#FAF9FF;color:var(--primary)}
.rev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rev ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rev li{display:flex;gap:8px;align-items:center}
.rev li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary-2);flex:none}
.activate{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#F3EFFF,#ECE6FF);border-radius:var(--r);padding:20px}

/* child portal */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:stretch;background:linear-gradient(135deg,#F4F0FF,#FFFFFF);border:1px solid var(--line);border-radius:20px;overflow:hidden}

.nextc .ico{width:48px;height:48px}
.planitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.planitem:first-child{border-top:0}
.planitem .pi{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary);flex:none;overflow:hidden}
.planitem .pi svg{width:24px;height:24px}
.planitem .pi.fig svg{width:100%;height:100%}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qa button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;display:grid;justify-items:start;gap:6px;text-align:right}
.qa button:hover{border-color:var(--primary)}
.qa b{font-family:var(--f-display);font-weight:700}
.cam3{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:16px;align-items:start}.cam3 .viewer{max-width:400px;width:100%;margin-inline:auto}
.viewer{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:560/752;max-width:100%}
.viewer video,.viewer img,.viewer canvas{width:100%;height:100%;object-fit:cover;display:block}
.corners::before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,255,255,.8);border-radius:14px;pointer-events:none;z-index:1;clip-path:polygon(0 0,18% 0,18% 2px,82% 2px,82% 0,100% 0,100% 18%,calc(100% - 2px) 18%,calc(100% - 2px) 82%,100% 82%,100% 100%,82% 100%,82% calc(100% - 2px),18% calc(100% - 2px),18% 100%,0 100%,0 82%,2px 82%,2px 18%,0 18%)}
.rec{position:absolute;top:18px;right:18px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;display:flex;gap:6px;align-items:center;z-index:2}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#FF4D5E;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.otip{position:absolute;bottom:14px;inset-inline:14px;background:rgba(20,14,50,.62);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center;z-index:2}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.checks li svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:2px}
.anl{list-style:none;margin:0;padding:0}
.anl li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.anl li .sp{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.anl li.run{color:var(--ink)} .anl li.run .sp{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
.anl li.done{color:var(--ink)} .anl li.done .sp{background:var(--ok);border-color:var(--ok);color:#fff}
.anl li.done .sp svg{width:12px;height:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.bigring{position:relative;width:140px;height:140px;margin:auto;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--primary)}
.bigring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bigang{font-family:var(--f-display);font-size:58px;font-weight:700;line-height:1;color:var(--primary)}
.rangebar{position:relative;height:12px;border-radius:99px;display:flex;overflow:hidden;margin-top:26px}
.rangebar i{display:block;height:100%}
.rangebar-wrap{position:relative}
.marker{position:absolute;top:-4px;width:4px;height:20px;border-radius:4px;background:var(--ink);transform:translateX(50%)}
.marker span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;font-family:var(--f-display)}
.rlabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.qrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.qrow .qi{width:46px;height:46px;border-radius:12px;background:#FFF1F0;color:#E0604F;display:grid;place-items:center;flex:none}
.qrow .qi svg{width:24px;height:24px}
.yn{display:flex;gap:4px;flex:none}
.yn button{border:1px solid var(--line);border-radius:10px;padding:7px 16px;font-weight:700;background:#fff;color:var(--ink-2)}
.yn button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;text-align:center}
.opt.on{border-color:var(--primary);background:var(--soft);color:var(--primary)}
.optrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input[type=range]{width:100%;accent-color:var(--primary)}
.pnum{font-family:var(--f-display);font-size:40px;font-weight:700;text-align:center;line-height:1.1}
.faces{display:flex;justify-content:space-between;font-size:28px}
.faces span{opacity:.3;transition:.2s} .faces span.on{opacity:1;transform:scale(1.2)}
textarea{min-height:84px;resize:vertical}
.medc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:right}
.medc .mi{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.medc .mi svg{width:24px;height:24px}
.st{border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;text-align:center;flex:none;min-width:96px}
.st.taken{background:var(--ok-soft);color:var(--ok)} .st.pending{background:#EEF1FB;color:#5A6488} .st.missed{background:var(--bad-soft);color:var(--bad)} .st.delayed{background:var(--warn-soft);color:var(--warn)}
.statusbtns{display:flex;gap:6px;flex-wrap:wrap}
.statusbtns button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:12.5px}
.statusbtns button.on.taken{background:var(--ok);border-color:var(--ok);color:#fff}
.statusbtns button.on.missed{background:var(--bad);border-color:var(--bad);color:#fff}
.statusbtns button.on.delayed{background:var(--warn);border-color:var(--warn);color:#fff}
.mhint{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* overlays */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}

.modal-back{position:fixed;inset:0;background:rgba(20,14,50,.45);display:grid;place-items:center;z-index:60;padding:16px}

.proto{font-size:11.5px;text-align:center;color:var(--muted)}
.selbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13px;color:var(--ink-2)}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.fchips button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.alert-row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;width:100%;text-align:right}
.alert-row.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
.alert-row.read{opacity:.65}
.alert-row svg.av{width:44px;height:44px;flex:none}
.sev{width:5px;align-self:stretch;border-radius:9px;flex:none}
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;min-height:540px}

.chat .conv{display:flex;flex-direction:column;min-width:0}

.bub{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.55}
.bub.me{background:var(--primary);color:#fff;align-self:flex-start;border-bottom-right-radius:4px}
.bub.them{background:#fff;align-self:flex-end;border:1px solid var(--line);border-bottom-left-radius:4px}

.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

.set-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}

.numin{width:70px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center;font-family:var(--f-display);font-weight:700}
.daychip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--primary);background:#FAF9FF;color:var(--primary);border-radius:12px;padding:8px 8px 8px 12px;font-weight:700}

.presets{display:flex;gap:8px;flex-wrap:wrap}

.live3{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:16px;align-items:start}
.live-view{position:relative;border-radius:18px;overflow:hidden;background:#111;width:100%;max-width:560px;margin-inline:auto;aspect-ratio:3/4;max-height:72vh}

const _ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const MV_T=[[0,.9,'pos'],[.9,2.8,'act'],[2.8,4.6,'hold'],[4.6,6.1,'back'],[6.1,6.8,'rest']],MV_LEN=6.8;
function mvPose(key,sec){const m=MOTION[key];sec=((sec%MV_LEN)+MV_LEN)%MV_LEN;const ph=MV_T.find(p=>sec>=p[0]&&sec<p[1])||MV_T[0];let u=0;
  if(ph[2]==='act')u=_ease((sec-ph[0])/(ph[1]-ph[0]));else if(ph[2]==='hold')u=1;else if(ph[2]==='back')u=1-_ease((sec-ph[0])/(ph[1]-ph[0]));
  const p={...m.a};for(const k in m.b)p[k]=m.a[k]+(m.b[k]-(m.a[k]??0))*u;const deg=Math.round(m.deg[0]+(m.deg[1]-m.deg[0])*u);
  const hold=ph[2]==='hold'?Math.max(1,Math.ceil(2-(sec-ph[0])/(ph[1]-ph[0])*2)):0;return {p,u,deg,ph:ph[2],hold,sec}}
const MV_VB={hand:'4 38 112 64',wrist:'0 18 120 127'};
function mvDraw(key,p){const m=MOTION[key];const s=m.v==='foot'?footSVG(p):m.v==='hand'?handSVG(p):m.v==='seat'?seatSVG(p):m.v==='ser'?serSVG(p):fig(p);const vb=MV_VB[key.split('_')[0]];return vb?s.replace('viewBox="0 0 120 145"',`viewBox="${vb}"`):s}
function mvCaption(key,st){const m=MOTION[key];return st.ph==='pos'||st.ph==='rest'?['1','الوضعية',m.pos]:st.ph==='act'?['2','الحركة',m.act]:st.ph==='hold'?['3','اثبتي',`ثبّتي ${st.hold===2?'ثانيتين':'ثانية'} عند أقصى حد مريح`]:['4','الرجوع','ارجعي ببطء لوضعية البداية']}
// player markup + loop; frame(el,key,sec) renders one deterministic frame (used for the MP4 export too)
function mvPlayer(key){return `<div class="mvp" data-mvp="${key}"><div class="mvp-stage"><div class="mvp-fig"></div><div class="mvp-deg ltr">0°</div></div>
  <div class="mvp-cap"><span class="mvp-n">1</span><div><b class="mvp-t"></b><div class="mvp-d"></div></div></div>
  <div class="mvp-bar"><button class="mvp-pp" aria-label="إيقاف مؤقت">${ic('pause')}</button><div class="mvp-prog"><i></i></div><span class="muted tiny">${Math.round(MOTION[key].deg[1]||MOTION[key].deg[0])}° قيمة توضيحية</span></div></div>`}
const mvVideo=key=>`<div class="mvv"><video class="mvvid" data-mvkey="${key}" src="videos/MADA-${key}.mp4" autoplay muted loop playsinline controls preload="auto"></video></div>`;
document.addEventListener('error',e=>{const v=e.target;if(v&&v.classList&&v.classList.contains('mvvid')){const box=v.closest('.mvv');if(box){box.outerHTML=mvPlayer(v.dataset.mvkey);MVP.mount(document)}}},true);
const MVP={frame(el,key,sec){const st=mvPose(key,sec);$('.mvp-fig',el).innerHTML=mvDraw(key,st.p);$('.mvp-deg',el).textContent=st.deg+'°';$('.mvp-deg',el).classList.toggle('on',st.ph==='hold');
    const [n,tt,d]=mvCaption(key,st);$('.mvp-n',el).textContent=n;$('.mvp-t',el).textContent=tt;$('.mvp-d',el).textContent=d;$('.mvp-prog i',el).style.width=(st.sec/MV_LEN*100)+'%'},
  mount(root){$$('[data-mvp]',root).forEach(el=>{if(el._on)return;el._on=1;const key=el.dataset.mvp;if(!MOTION[key])return;let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),off=playing?0:3.2;
    const pp=$('.mvp-pp',el);const icon=()=>{pp.innerHTML=ic(playing?'pause':'play');pp.setAttribute('aria-label',playing?'إيقاف مؤقت':'تشغيل')};icon();
    pp.onclick=()=>{if(playing){off=(performance.now()-t0)/1000+off;playing=false}else{t0=performance.now();playing=true;tick()}icon()};
    const tick=()=>{if(!el.isConnected||!playing)return;MVP.frame(el,key,off+(performance.now()-t0)/1000);requestAnimationFrame(tick)};
    MVP.frame(el,key,off);if(playing)requestAnimationFrame(tick)})}};

/* ================= motion layer =================
   GSAP + ScrollTrigger + Lenis, and vanilla ports of three React Bits components
   (BlurText, LightRays, StarBorder) plus a CountUp. Calm by design; everything is
   skipped under prefers-reduced-motion, and the page stays complete if a CDN fails. */
const FX={lenis:null,tick:null,rays:null,io:null,
  reduced:()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,
  hasGsap:()=>!!(window.gsap&&window.ScrollTrigger)};
FX.destroy=function(){
  if(FX.rays){FX.rays.destroy();FX.rays=null}
  if(FX.io){FX.io.disconnect();FX.io=null}
  if(FX.hasGsap()){ScrollTrigger.getAll().forEach(s=>s.kill())}
  if(FX.tick&&window.gsap){gsap.ticker.remove(FX.tick);FX.tick=null}
  if(FX.lenis){FX.lenis.destroy();FX.lenis=null}
};
FX.landing=function(){
  FX.destroy();
  const reduced=FX.reduced();
  FX.rays=lightRays($('#heroRays'),{raysColor:'#7C64F2',raysSpeed:.6,lightSpread:.9,rayLength:1.4,fadeDistance:1,followMouse:true,mouseInfluence:.08,still:reduced});
  blurText($('#heroTitle'),{reduced});
  FX.counters($('#root'));
  if(reduced||!FX.hasGsap())return;
  gsap.registerPlugin(ScrollTrigger);
  // Lenis driven by GSAP's ticker so smooth scroll and ScrollTrigger share one clock
  if(window.Lenis){
    FX.lenis=new Lenis({lerp:.1,smoothWheel:true,anchors:{offset:-80}});
    FX.lenis.on('scroll',ScrollTrigger.update);
    FX.tick=time=>{FX.lenis&&FX.lenis.raf(time*1000)};
    gsap.ticker.add(FX.tick);
    gsap.ticker.lagSmoothing(0);
  }
  // hero image settles in
  gsap.from('.hero .ph',{opacity:0,y:18,scale:.985,duration:1,ease:'power2.out',delay:.25,clearProps:'transform,opacity'});
  // each section eases in on scroll (once)
  const targets=gsap.utils.toArray('.hero .feat>div, .how h2, .how>p, .steps3 .c, .who-sec h2, .who-sec>p, .who2 .c, .foot');
  gsap.set(targets,{opacity:0,y:24});
  ScrollTrigger.batch(targets,{start:'top 90%',once:true,
    onEnter:batch=>gsap.to(batch,{opacity:1,y:0,duration:.8,ease:'power2.out',stagger:.08,overwrite:true,clearProps:'transform'})});
  ScrollTrigger.refresh();
};
/* CountUp: numbers count from 0 to their value once they come into view */
FX.seen=new Set();
FX.counters=function(root){
  if(!root||FX.reduced())return;
  const key=R.route+':'+(R.route==='doc'?R.D.page:R.route==='kid'?R.K.page:'');if(FX.seen.has(key))return;FX.seen.add(key);
  const els=[...root.querySelectorAll('[data-count], .kpi b, .bignum b')].filter(e=>!e.dataset.counted&&/\d/.test(e.textContent)&&!e.querySelector('[data-count]'));
  if(!els.length)return;
  const run=el=>{el.dataset.counted='1';
    const raw=el.dataset.count||el.textContent;const m=raw.match(/-?\d+(\.\d+)?/);if(!m)return;
    const end=parseFloat(m[0]),dec=(m[1]||'').length-1>0?(m[1].length-1):0;const tmpl=el.dataset.count?null:el.textContent;
    const fmtv=v=>{const s=dec?v.toFixed(dec):Math.round(v).toString();return tmpl?tmpl.replace(m[0],s):s};
    const o={v:0};
    if(window.gsap)gsap.to(o,{v:end,duration:1.2,ease:'power2.out',onUpdate:()=>{el.textContent=fmtv(o.v)}});
    else{const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/1200),e=1-Math.pow(1-k,3);el.textContent=fmtv(end*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}};
  if(!('IntersectionObserver' in window)){els.forEach(run);return}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);run(en.target)}}),{threshold:.4});
  els.forEach(e=>io.observe(e));
};
/* BlurText: words drift in from slightly above, unblurring (React Bits defaults: animateBy words, direction top, 200ms step) */
function blurText(el,{reduced}={}){
  if(!el||el.dataset.split)return;el.dataset.split='1';
  const words=[];
  el.querySelectorAll('[data-bt]').forEach(line=>{const parts=line.textContent.split(' ');line.textContent='';
    parts.forEach((w,i)=>{const s=document.createElement('span');s.className='bt-w';s.textContent=w;line.appendChild(s);words.push(s);if(i<parts.length-1)line.appendChild(document.createTextNode(' '))})});
  if(reduced||!window.gsap)return;
  gsap.set(words,{filter:'blur(10px)',opacity:0,y:-30});
  gsap.to(words,{keyframes:[{filter:'blur(5px)',opacity:.5,y:4,duration:.35,ease:'power1.out'},{filter:'blur(0px)',opacity:1,y:0,duration:.35,ease:'power1.out'}],stagger:.2,delay:.15,clearProps:'filter,transform,opacity'});
}
/* LightRays: WebGL light shafts from just above the top edge (port of React Bits <LightRays/>, origin top-center) */
function lightRays(host,o){
  if(!host)return null;
  const cv=document.createElement('canvas');host.appendChild(cv);
  const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false});
  if(!gl){cv.remove();return null}
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision highp float;
uniform float iTime;uniform vec2 iResolution;uniform vec2 rayPos;uniform vec2 rayDir;uniform vec3 raysColor;
uniform float raysSpeed;uniform float lightSpread;uniform float rayLength;uniform float fadeDistance;
float rayStrength(vec2 src,vec2 dir,vec2 coord,float sA,float sB,float speed){

function romChart(pts,{min=0,max=150,step=30,ylabel='درجة الثني',unit='°',ref=null,other=null}={}){
  if(ref)max=Math.max(max,Math.ceil((ref.hi+8)/step)*step);if(other&&other.length)max=Math.max(max,Math.ceil((Math.max(...other.map(o=>o.v))+8)/step)*step);
  const Wd=440,H=210,pl=44,pr=30,pt=24,pb=30;
  const n=Math.max(pts.length,2);const x=i=>pl+(Wd-pl-pr)*(pts.length===1?.5:i/(n-1));const y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let g='';for(let v=min;v<=max;v+=step)g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F0EEF7"/><text class="ax" x="${pl-8}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ');
  const area=pts.length?`${x(0)},${y(min)} ${line} ${x(pts.length-1)},${y(min)}`:'';
  const gid='g'+Math.random().toString(36).slice(2,6);
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#fff" stroke="#5B3FE0" stroke-width="2"/><text x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle" font-size="11" font-weight="600" fill="${i===pts.length-1?'#5B3FE0':'#403B66'}" font-family="Cairo,sans-serif">${p.v}${unit}</text><text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`).join('');
  const band=ref?`<rect x="${pl}" width="${Wd-pl-pr}" y="${y(ref.hi)-3}" height="${Math.max(6,y(ref.lo)-y(ref.hi)+6)}" fill="#17A06A" opacity=".16"/><line x1="${pl}" x2="${Wd-pr}" y1="${y(ref.mean)}" y2="${y(ref.mean)}" stroke="#17A06A" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${Wd-pr}" y="${y(ref.mean)-6}" text-anchor="end" font-size="10.5" font-weight="700" fill="#0E7A50" font-family="Cairo,sans-serif">${Math.round(ref.mean)}° · ${ref.label}</text>`:'';
  const oth=other&&other.length?`<polyline points="${other.map(o=>{const i=pts.findIndex(p=>p.d===o.d);return i<0?null:`${x(i)},${y(o.v)}`}).filter(Boolean).join(' ')}" fill="none" stroke="#F2994A" stroke-width="2" stroke-dasharray="2 3"/>${other.map(o=>{const i=pts.findIndex(p=>p.d===o.d);return i<0?'':`<circle cx="${x(i)}" cy="${y(o.v)}" r="3.5" fill="#F2994A"/>`}).join('')}`:'';
  return `<svg viewBox="0 0 ${Wd} ${H}" direction="ltr" role="img" aria-label="${ylabel}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C64F2" stop-opacity=".25"/><stop offset="1" stop-color="#7C64F2" stop-opacity="0"/></linearGradient></defs>${g}${band}${oth}<text class="ax" transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle">${ylabel}</text>${area?`<polygon points="${area}" fill="url(#${gid})"/>`:''}<polyline points="${line}" fill="none" stroke="#5B3FE0" stroke-width="2.5"/>${dots}</svg>`;
}

  if(el=t.closest('[data-mvvid]')){const m=mvOf(W.joint,el.dataset.mvvid);if(m.video)videoModal('الفيديو التعليمي · '+m.ar,'Standardized instructional video');else mvModal(W.joint,el.dataset.mvvid);return}

  if(el=t.closest('[data-all]')){const key=el.dataset.all;const list=key==='symptoms'?SYM:SE;W[key]=list.every(s=>W[key].includes(s.k))?[]:list.map(s=>s.k);D.re();return}

  if(el=t.closest('[data-rmmed]')){W.meds=W.meds.filter(x=>x.id!=el.dataset.rmmed);D.re();return}
  if(el=t.closest('[data-quick]')){const q=QUICK_MEDS[+el.dataset.quick];$('#fName').value=q.name;$('#fDose').value=q.dose;$('#fRoute').value=q.route;$('#fFreq').value=q.freq;return}

    ${p.symptoms.map(k=>{const T=Q_TEXT[k];const s=SYM.find(x=>x.k===k);return `<div class="qrow"><span class="qi">${ic(s.i)}</span><div class="grow"><b>${T.t}</b><div class="muted small">${T.q(JOINTS[mv.j].ar)}</div></div>${yn('ans',k)}</div>`}).join('')}
    ${p.otherSym?`<div class="qrow"><div class="grow"><b>${p.otherSym}</b><div class="muted small">سؤال أضافه الطبيب</div></div>${yn('ans','other')}</div>`:''}</div>`;
  if(Q.i===1){const faces=['😀','🙂','😐','😕','😣','😭'],fi=Math.min(5,Math.round(Q.pain/2));
    b=`<div class="g2">${p.symptoms.includes('pain')&&Q.ans.pain!==false?`<div class="card" style="display:grid;gap:10px"><b class="h">شدة الألم</b><div class="faces">${faces.map((f,k)=>`<span class="${k===fi?'on':''}">${f}</span>`).join('')}</div><input type="range" id="pain" min="0" max="10" value="${Q.pain}" aria-label="شدة الألم"><div class="pnum" id="pn">${Q.pain}<span class="muted" style="font-size:16px"> / 10</span></div></div>`:'<div class="card muted">لا يوجد ألم 👍</div>'}
    ${p.symptoms.includes('stiff')&&Q.ans.stiff!==false?`<div class="card" style="display:grid;gap:10px"><b class="h">كم استمر التيبس الصباحي؟</b><div class="optrow">${['15 min','30 min','60 min','>60 min'].map(o=>`<button class="opt ${Q.stiffDur===o?'on':''}" data-st="${o}"><span class="ltr">${o}</span></button>`).join('')}</div></div>`:''}</div>`}
  if(Q.i===2)b=`<div class="g2">${p.functional.length?`<div class="card" style="display:grid;gap:8px"><b class="h">الوظيفة الحركية</b>${p.functional.map(k=>{const f=FN.find(x=>x.k===k);const q={phys:'هل قلّ نشاطه البدني هذا الأسبوع؟',school:'هل تغيّب عن المدرسة بسبب الأعراض؟',adl:'هل يحتاج مساعدة في الأنشطة اليومية؟'}[k];return `<div class="qrow"><span class="qi" style="background:var(--soft);color:var(--primary)">${ic(f.i)}</span><div class="grow"><b class="small">${f.ar}</b><div class="muted tiny">${q}</div></div>${yn('fn',k)}</div>`}).join('')}</div>`:''}
    ${p.sideEffects.length?`<div class="card" style="display:grid;gap:8px"><b class="h">هل لاحظت أيًّا من هذه بعد الدواء؟</b>${p.sideEffects.map(k=>{const s=SE.find(x=>x.k===k);return `<div class="qrow"><span class="qi">${ic(s.i)}</span><b class="grow small">${s.ar}</b>${yn('se',k)}</div>`}).join('')}</div>`:''}</div>`;
  if(Q.i===3){const yes=Object.entries(Q.ans).filter(([k,v])=>v).map(([k])=>k==='other'?p.otherSym:Q_TEXT[k].t);const sey=Object.entries(Q.se).filter(([k,v])=>v).map(([k])=>SE.find(x=>x.k===k).ar);
    b=`<div class="g2"><div class="card" style="display:grid;gap:8px"><b class="h">ملخص الإجابات</b>${[['الأعراض',yes.join('، ')||'لا يوجد'],...(Q.ans.pain?[['شدة الألم',Q.pain+'/10']]:[]),...(Q.ans.stiff?[['مدة التيبس',Q.stiffDur]]:[]),['آثار جانبية',sey.join('، ')||'لا يوجد']].map(([l,v])=>`<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><span class="muted grow">${l}</span><b>${v}</b></div>`).join('')}</div>
    <div class="card fld"><label for="note">ملاحظات إضافية (اختياري)</label><textarea id="note" placeholder="مثال: صعوبة في صعود الدرج صباحًا">${Q.note}</textarea></div></div>`}
  n.innerHTML=`<div class="card" style="padding:14px 10px"><nav class="stepper" style="grid-template-columns:repeat(4,1fr)">${steps.map((t,i)=>`<span class="s ${i===Q.i?'on':i<Q.i?'done':''}"><i>${i<Q.i?ic('check'):i+1}</i>${t}</span>`).join('')}</nav></div>${b}
  <div class="wiz-foot"><button class="btn lg" id="qn">${Q.i===3?'إرسال للطبيب':'التالي'} ${ic('fwd')}</button>${Q.i>0?`<button class="btn white" id="qp">${ic('back')} السابق</button>`:''}</div>`;
  const re=()=>K.go('symptoms');
  $$('[data-yn]',n).forEach(x=>x.onclick=()=>{const [key,k,v]=x.dataset.yn.split(':');Q[key][k]=v==='1';re()});
  $$('[data-st]',n).forEach(x=>x.onclick=()=>{Q.stiffDur=x.dataset.st;re()});
  const pr=$('#pain',n);if(pr)pr.oninput=e=>{Q.pain=+e.target.value;$('#pn',n).firstChild.textContent=Q.pain;const fi=Math.min(5,Math.round(Q.pain/2));$$('.faces span',n).forEach((s,k)=>s.classList.toggle('on',k===fi))};
  const nt=$('#note',n);if(nt)nt.oninput=e=>Q.note=e.target.value;
  const qp=$('#qp',n);if(qp)qp.onclick=()=>{Q.i--;re()};
  $('#qn',n).onclick=()=>{if(Q.i===0&&p.symptoms.some(k=>Q.ans[k]===undefined)){toast('أجب بنعم أو لا على كل الأسئلة');return}
    if(Q.i<3){Q.i++;re();return}
    const d=nextDay();if(d!=null){const map={'15 min':15,'30 min':30,'60 min':60,'>60 min':75};S.A[d]={...(S.A[d]||{}),pain:Q.ans.pain?Q.pain:0,stiff:Q.ans.stiff?map[Q.stiffDur]:0,swell:Q.ans.swell?'نعم':'لا',fn:Object.values(Q.fn).some(v=>v)?'محدود':'تحسن',note:Q.note}}
    const painV=Q.ans.pain?Q.pain:0;S.alerts.unshift(painV>=S.settings.pain?{id:Date.now(),pid:'wateen',sev:'bad',cat:'sym',title:`ارتفاع الألم إلى ${painV}/10`,text:'أبلغ ولي الأمر عن ألم مرتفع في استبيان الأعراض.'+(Q.note?' ملاحظة: '+Q.note:''),time:'الآن',read:false}:{id:Date.now(),pid:'wateen',sev:'info',cat:'sym',title:'استبيان أعراض جديد',text:`الألم ${painV}/10`+(Q.note?' · '+Q.note:''),time:'الآن',read:false});
    if(d!=null&&typeof Cloud!=='undefined')Cloud.emit('sym',{d,vals:{pain:S.A[d].pain,stiff:S.A[d].stiff,swell:S.A[d].swell,fn:S.A[d].fn,note:S.A[d].note||''}});
    R.K.q=null;K.go('symDone')};
};
KP.symDone=n=>{n.innerHTML=`<div class="card" style="text-align:center;display:grid;gap:10px;padding:40px 16px;justify-items:center"><div class="ok-ic">${ic('check')}</div><b class="h" style="font-size:20px">تم إرسال التقييم للطبيب</b><span class="muted">يظهر الآن في ملف وتين لدى د. مدى الجعيد</span><div class="row" style="gap:10px;margin-top:6px"><button class="btn" data-k="reports">عرض تقاريري</button><button class="btn white" data-k="home">الرئيسية</button></div></div>`};
KP.meds=n=>{
  const p=W0().plan,a=adherence();const lab={taken:'تم تناوله',pending:'قيد الانتظار',missed:'لم يتم تناوله',delayed:'تم تأخيره'};
  n.innerHTML=`<div class="split"><div class="card" style="display:grid;gap:10px"><div class="card-h" style="margin:0"><div class="t"><b>أدوية اليوم</b><span>الجمعة، 6 نوفمبر 2026 · سجّل حالة كل جرعة</span></div><span class="row small" style="gap:8px">التذكيرات <button class="sw ${p.reminders?'on':''}" id="krem" aria-label="تذكيرات الأدوية"></button></span></div>
    ${p.meds.map(m=>{const s=S.medStatus[m.id]||'pending';return `<div class="medc"><span class="mi">${ic(ROUTES[m.route].i)}</span><div class="grow"><b>${m.name}</b><div class="muted small">${m.dose} · ${m.freq} · ${m.day} ${t12(m.time)}</div><div class="statusbtns" style="margin-top:8px">${[['taken','✓ تم أخذه'],['missed','✕ لم تؤخذ'],['delayed','⏱ متأخرة']].map(([k,l])=>`<button class="${k} ${s===k?'on':''}" data-ms="${m.id}:${k}">${l}</button>`).join('')}</div></div><span class="st ${s}">${lab[s]}</span></div>`}).join('')||'<div class="muted">لم يضف الطبيب أدوية</div>'}</div>
    <div class="card"><div class="card-h"><div class="t"><b>سجل الالتزام</b><span>كل الجرعات المسجلة</span></div></div><div class="row" style="flex-wrap:wrap">${donut(a)}<div class="legend-list"><div><i style="background:#17A06A"></i>تم أخذه<b>${a.taken}</b></div><div><i style="background:#E2455A"></i>لم يُؤخذ<b>${a.missed}</b></div><div><i style="background:#F2B33D"></i>متأخر<b>${a.delayed}</b></div></div></div></div></div>`;
  $$('[data-ms]',n).forEach(b=>b.onclick=()=>{const [id,s]=b.dataset.ms.split(':');S.medStatus[id]=s;Cloud.emit('med',{id,s,name:(W0().plan.meds.find(m=>m.id==id)||{}).name});toast('تم التسجيل · يظهر في سجل الالتزام لدى الطبيب');K.go('meds')});
  $('#krem',n).onclick=e=>{p.reminders=!p.reminders;e.currentTarget.classList.toggle('on',p.reminders);toast(p.reminders?'تم تفعيل التذكيرات':'تم إيقاف التذكيرات')};
};
KP.reports=n=>{
  const p=W0().plan,pts=romPts(),first=pts[0],last=pts[pts.length-1],a=adherence();const done=planDays(p).filter(d=>S.A[d]).length;const pain=romPts('pain'),st=romPts('stiff');
  n.innerHTML=`<div class="g4">
    <div class="card kpi"><span class="ico">${ic('j_knee')}</span><div><span class="muted small">آخر مدى للركبة</span><b class="ltr">${last.v}°</b><span class="d" style="color:var(--ok)">↑ +${last.v-first.v}°</span></div></div>
    <div class="card kpi"><span class="ico" style="background:var(--bad-soft);color:var(--bad)">${ic('bolt')}</span><div><span class="muted small">مستوى الألم</span><b>${pain[pain.length-1].v}/10</b><span class="d" style="color:var(--ok)">↓ من ${pain[0].v}</span></div></div>
    <div class="card kpi"><span class="ico" style="background:var(--warn-soft);color:var(--warn)">${ic('sun')}</span><div><span class="muted small">التيبس الصباحي</span><b>${st[st.length-1].v} د</b><span class="d" style="color:var(--ok)">↓ من ${st[0].v}</span></div></div>
    <div class="card kpi"><span class="ico" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}</span><div><span class="muted small">التقييمات المكتملة</span><b>${done}/${planDays(p).length}</b><span class="d muted">الالتزام بالعلاج ${a.pct}%</span></div></div></div>
  <div class="card"><div class="card-h"><div class="t"><b>تطور زاوية ثني الركبة</b><span>Knee ROM</span></div></div><div class="chart">${romChart(pts.map(x=>({...x,l:'اليوم '+(x.d||1)})))}</div></div>
  <div class="card row"><span class="ico" style="background:#FFF6DD;color:#E2A400">${ic('star')}</span><div class="grow">أكملتِ ${done} تقييمات! كل تقييم يضيف نجمة ⭐ اجمعي 5 وافتحي شارة "بطلة الحركة".</div></div>
  <div class="proto">بيانات توضيحية للنموذج الأولي</div>`;
};

/* boot */
const h=(location.hash||'').slice(1);
if(h==='doc')go('doc');else if(h==='kid')go('kid');else go('landing');
</script>
